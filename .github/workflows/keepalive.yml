name: Keep-alive

# Pings the deployed /health every 3 days so the free-tier backend and database (which
# /health queries) are not paused for inactivity. Set the HEALTH_URL repository secret,
# e.g. https://<app>.up.railway.app/health. Without it the job skips.
on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "HEALTH_URL secret is not set; skipping."
            exit 0
          fi
          curl -fsS --max-time 60 --retry 3 --retry-delay 20 "$HEALTH_URL"
