services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: idm
      POSTGRES_PASSWORD: idm
      POSTGRES_DB: idm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idm -d idm"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
